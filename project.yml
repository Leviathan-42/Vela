name: Vela
options:
  bundleIdPrefix: dev.probable.levi
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer
    from: "2.0.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Vela:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Vela
        excludes:
          - "Secrets.example.swift"
    dependencies:
      - package: KSPlayer
        product: KSPlayer
    preBuildScripts:
      - name: Patch invalid SPM framework bundle ids
        script: |
          ROOT="${BUILD_DIR%/Build/Products}"
          # Patch every libshaderc_combined.framework Info.plist anywhere in DerivedData
          find "$ROOT" -path "*libshaderc_combined.framework/Info.plist" 2>/dev/null | while read -r plist; do
            chmod -R +w "$(dirname "$plist")" 2>/dev/null || true
            BID="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$plist" 2>/dev/null || echo "")"
            case "$BID" in
              *_*)
                FIXED="${BID//_/-}"
                /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $FIXED" "$plist" 2>/dev/null && \
                  echo "Patched: $BID -> $FIXED"
                ;;
            esac
          done
          # Force re-embed by removing any stale embedded copy
          rm -rf "${TARGET_BUILD_DIR}/${PRODUCT_NAME}.app/Frameworks/libshaderc_combined.framework" 2>/dev/null || true
          exit 0
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.probable.levi.vela
        PRODUCT_NAME: Vela
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_CFBundleDisplayName: Vela
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
